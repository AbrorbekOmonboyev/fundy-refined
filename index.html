<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundy — crowdfunding for good causes in Uzbekistan</title>
    <meta
      name="description"
      content="Donate to checked causes in Uzbekistan. Money is paid out stage by stage, with a public report of what was spent."
    />

    <!-- Icons (from the brand kit, 03-Favicon) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FAF9F6" />
    <!-- Dark mode before the first paint (no white flash); see src/lib/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem('fundy-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <!-- Link previews (Telegram, Facebook, X) -->
    <meta property="og:site_name" content="Fundy" />
    <meta property="og:title" content="Fundy — crowdfunding for good causes in Uzbekistan" />
    <meta
      property="og:description"
      content="Donate to checked causes in Uzbekistan. Money is paid out stage by stage, with a public report of what was spent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.fundy.uz/og-image.png" />
    <meta property="og:url" content="https://www.fundy.uz/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Font: Onest everywhere (Latin incl. Uzbek oʻ gʻ, and Cyrillic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
