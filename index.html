<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundy — From small dreams to big change</title>
    <meta
      name="description"
      content="Interest-free crowdfunding and Musharakah profit-sharing for Uzbekistan's creators, startups and communities. Raise funds, gain trust, and make it real."
    />

    <!-- Icons (from the brand kit, 03-Favicon) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#B5F23D" />
    <!-- Dark mode before the first paint (no white flash); see src/lib/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem("fundy-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Link previews (Telegram, Facebook, X) -->
    <meta property="og:site_name" content="Fundy" />
    <meta property="og:title" content="Fundy — From small dreams to big change" />
    <meta property="og:description" content="Raise funds, gain trust, and make it real. Interest-free crowdfunding for Uzbekistan." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.fundy.uz/og-image.png" />
    <meta property="og:url" content="https://www.fundy.uz/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand fonts: Unbounded (headlines), Plus Jakarta Sans (everything else) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
