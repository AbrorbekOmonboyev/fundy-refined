<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ikat look: the dye "bleeds" sideways along the threads -->
    <filter id="ikat" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="A"/>
    </filter>
    <pattern id="tile" width="240" height="320" patternUnits="userSpaceOnUse">
      <rect width="240" height="320" fill="#173a5e"/>
      <path d="M120 14 L222 160 L120 306 L18 160 Z" fill="#f2a65a"/>
      <path d="M120 70 L182 160 L120 250 L58 160 Z" fill="#9cc9e8"/>
      <path d="M120 122 L146 160 L120 198 L94 160 Z" fill="#f7efe2"/>
      <path d="M0 0 L40 0 L0 56 Z M240 0 L200 0 L240 56 Z M0 320 L40 320 L0 264 Z M240 320 L200 320 L240 264 Z" fill="#9cc9e8"/>
      <circle cx="0" cy="160" r="16" fill="#f7efe2"/><circle cx="240" cy="160" r="16" fill="#f7efe2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#173a5e"/>
  <rect x="-40" y="-40" width="1680" height="1080" fill="url(#tile)" filter="url(#ikat)"/>
</svg>
